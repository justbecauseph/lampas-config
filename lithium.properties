# Lithium Production Adjustments for High-Concurrency + Create Mod

# Server-Side Raycasting (DO NOT DISABLE ON SERVER)
# Note: You may see GitHub issues recommending setting this to false to fix Create's Ponder "Identify" mode. 
# That is a client-side rendering bug. On this dedicated server, keep this enabled (true) 
# to optimize vector tracking for block interaction across 200 players.
mixin.world.raycast=true

# Physics & Block Collisions
# Speeds up entity axis-aligned bounding box (AABB) checks against moving structures and block states.
mixin.entity.collisions=true

# AI & Pathfinding Thread Protection
# If 200 players cause massive mob caps, Lithium's event-driven brain polling saves your TPS.
# Keep this active unless a specific custom mob causes a server thread hang.
mixin.ai=true

# Event-Driven Hopper Infrastructure
# Changes hoppers from a hard 20-tick polling loop to a passive inventory change listener.
# Crucial for performance alongside automation mods like Farmer's Delight and Create.
mixin.block.hopper=true